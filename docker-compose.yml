services:
  # Backend: ASP.NET Core 8 Web API & SignalR Hub
  stockticker-api:
    container_name: stockticker-api
    build:
      context: ./StockTicker.Api
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    restart: unless-stopped
    networks:
      - stockticker-net

  # Frontend: React 19 Single Page App + Nginx Reverse Proxy
  stockticker-client:
    container_name: stockticker-client
    build:
      context: ./StockTicker.Client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - stockticker-api
    restart: unless-stopped
    networks:
      - stockticker-net

networks:
  stockticker-net:
    driver: bridge
