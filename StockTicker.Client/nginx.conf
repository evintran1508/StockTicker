server {
    listen 80;
    server_name localhost;

    # Thư mục chứa bundle tĩnh React đã build
    root /usr/share/nginx/html;
    index index.html;

    # Gzip nén dữ liệu tăng tốc độ tải
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Single Page Application (SPA) Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy cho REST API: Điều hướng /stocks sang backend container
    location /stocks {
        proxy_pass http://stockticker-api:8080/stocks;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse Proxy cho SignalR Hub (Hỗ trợ WebSocket 100%)
    location /stockHub {
        proxy_pass http://stockticker-api:8080/stockHub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout dài để giữ kết nối WebSocket liên tục
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
